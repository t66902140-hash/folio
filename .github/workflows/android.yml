
name: Folio Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Build APK
        working-directory: apps/mobile
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Folio-Android-APK
          path: apps/mobile/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
