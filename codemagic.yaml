
workflows:
  android-build:
    name: Android APK Build
    max_build_duration: 120
    instance_type: linux_x2

    scripts:
      - name: Set Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/apk/**/*.apk
